<!doctype html>
<html lang="es" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zebra ZPL Inventory & Label Manager</title>
    <meta property="og:title" content="Zebra ZPL Inventory & Label Manager" />
    
    <!-- PWA Web App Manifest for PWABuilder & Android APK -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#fbbf24" />
    <meta name="background-color" content="#141414" />
    <meta name="description" content="Gestión de inventarios con impresión de etiquetas ZPL para impresoras del sistema/USB, báscula Torrey y control de salidas por escáner." />
    <meta property="og:description" content="Gestión de inventarios con impresión de etiquetas ZPL para impresoras del sistema/USB, báscula Torrey y control de salidas por escáner." />
    
    <!-- Mobile & Apple iOS Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZebraApp" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWABuilder
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration skipped or error:', err);
          });
        });
      }
    </script>
  </body>
</html>
