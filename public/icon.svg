<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#141414"/>
  <rect x="24" y="24" width="464" height="464" rx="72" fill="none" stroke="#fbbf24" stroke-width="8" stroke-dasharray="16 12"/>
  <!-- Zebra Barcode Lines -->
  <g fill="#fbbf24">
    <rect x="80" y="100" width="24" height="180" rx="4"/>
    <rect x="120" y="100" width="12" height="180" rx="2"/>
    <rect x="148" y="100" width="32" height="180" rx="4"/>
    <rect x="196" y="100" width="16" height="180" rx="2"/>
    <rect x="228" y="100" width="40" height="180" rx="4"/>
    <rect x="284" y="100" width="12" height="180" rx="2"/>
    <rect x="312" y="100" width="28" height="180" rx="4"/>
    <rect x="356" y="100" width="16" height="180" rx="2"/>
